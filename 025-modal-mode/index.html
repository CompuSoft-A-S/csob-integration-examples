<!DOCTYPE html>
<html>
<!-- ########################################################################################### -->
<!-- This demo shows MODAL display mode — the entire booking opens as a fullscreen overlay.     -->
<!-- Minimal setup: one button, one wrapper div, and displayMode: 'MODAL' in the options.       -->
<!-- Call controller.openModal() to open the booking from any button or link on your page.      -->
<!-- ########################################################################################### -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSOB – Modal Mode</title>

    <!-- Shared configuration (portal key) -->
    <script src="../config.js"></script>
    <!-- Load Compusoft Onlinebooking controller -->
    <script src="https://v3.onlinebooking.dk/csobV2/csob.controller.min.js"></script>

    <style>
        body {
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f4f8;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p {
            color: #666;
            margin-bottom: 24px;
        }

        .book-btn {
            font-size: 18px;
            padding: 14px 32px;
            background: #2ecc71;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .book-btn:hover {
            background: #27ae60;
        }
    </style>
</head>

<body>
    <h1>025 – Modal Mode</h1>
    <p>The booking opens as a fullscreen overlay when you click the button below.</p>

    <!-- This is the only wrapper needed for MODAL mode -->
    <div id="csob-modal-wrapper"></div>

    <!-- Your booking button — style it however you want -->
    <button class="book-btn" id="OpenBooking">Book Now</button>

    <script>
        (function () {
            'use strict';

            var controller = null;

            // Initialize with displayMode: 'MODAL'
            setTimeout(function () {
                controller = new csob.Controller({
                    csobPortalKey: CSOB_PORTAL_KEY,
                    displayMode: 'MODAL',
                    mainWrapper: '#csob-modal-wrapper'
                });
            });

            // Open the modal on button click
            document.getElementById('OpenBooking').addEventListener('click', function () {
                if (controller) {
                    controller.openModal(this);
                }
            });
        })();
    </script>
</body>

</html>
