<!DOCTYPE html>
<html>
<!-- ########################################################################################### -->
<!-- Profile result list as a card grid                                                          -->
<!-- Pure-CSS transformation of the default CSOB ProfileResultList into a 2/3-column card grid.  -->
<!-- No init options or controller customization — only CSS overrides on top of CSOB's classes. -->
<!-- ########################################################################################### -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSOB – Profile result list as card grid</title>

    <script src="../config.js"></script>
    <script src="https://v3.onlinebooking.dk/csobV2/csob.controller.min.js"></script>

    <link rel="stylesheet" href="card-grid.css">

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f5f7fa;
            color: #222;
        }

        h1 {
            margin: 0 0 8px;
        }

        .lead {
            color: #666;
            margin: 0 0 24px;
        }

        .layout {
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            align-self: start;
        }

        .results {
            min-width: 0;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <h1>Profile result list — card grid</h1>
    <p class="lead">The default CSOB result list is a horizontal row per item. Here it is restyled into a responsive
        card grid using only CSS — no custom controller code.</p>

    <div class="layout">
        <aside class="sidebar">
            <div id="CalendarWrapper"></div>
            <div id="ProfileFilterWrapper"></div>
        </aside>

        <main class="results">
            <div class="toolbar">
                <div id="CalendarSmallWrapper"></div>
            </div>
            <div id="ProfileResultListWrapper"></div>
        </main>
    </div>

    <script>
        // Pre-populate dates so results show up on first load
        function plus(d, days) { const x = new Date(d); x.setDate(x.getDate() + days); return x; }
        function fmt(d) { return String(d.getDate()).padStart(2, '0') + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + d.getFullYear(); }
        var today = new Date();
        var from = fmt(plus(today, 14));
        var to = fmt(plus(today, 21));

        new csob.Controller({
            csobPortalKey: CSOB_PORTAL_KEY,
            initialCalendarWrapper: '#CalendarWrapper',
            secondaryCalendarWrapper: '#CalendarSmallWrapper',
            profileFilterWrapper: '#ProfileFilterWrapper',
            profileListWrapper: '#ProfileResultListWrapper',
            from: from,
            to: to
        });
    </script>
</body>

</html>
