<!DOCTYPE html>
<html>
<!-- ######################################################################################### -->
<!-- Demo 1: Quick start — the simplest way to embed CSOB using the built-in STANDARD template -->
<!-- ######################################################################################### -->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compusoft Onlinebooking - Quick start</title>
    <!-- Shared configuration (portal key) -->
    <script src="../config.js"></script>
    <!-- Load Compusoft Onlinebooking controller -->
    <script src="https://v3.onlinebooking.dk/csobV2/csob.controller.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                new csob.Controller({
                    csobPortalKey: CSOB_PORTAL_KEY
                    , displayMode: 'STANDARD'
                    , mainWrapper: '#csob-app'
                    // In STANDARD mode CSOB auto-calculates the container height.
                    // Set this to true if you want to control the height yourself
                    // via CSS on the container (see the height rule below).
                    , disableHeightCalc: true
                });
            });
        });
    </script>
    <style>
        /* When `disableHeightCalc: true` is set, the host page owns the height.
           Give the container a sensible height — e.g. full viewport, a fixed
           pixel value, or whatever fits your layout. */
        #csob-app {
            height: 100vh;
        }
    </style>
</head>

<body>
    <!-- This is the only element you provide. CSOB renders everything inside it. -->
    <div id="csob-app"></div>
</body>

</html>
